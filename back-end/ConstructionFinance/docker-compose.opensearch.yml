# Ambiente local de teste para o agente de troubleshooting (ConstructionFinance).
# Sobe OpenSearch + Dashboards isolados, sem segurança (uso local/dev apenas).
#
# Uso:
#   docker compose -f docker-compose.opensearch.yml up -d
#   docker compose -f docker-compose.opensearch.yml down          # para
#   docker compose -f docker-compose.opensearch.yml down -v       # para e apaga os dados indexados
#
# Dashboards:  http://localhost:5601
# API OpenSearch: http://localhost:9200  (GET / deve responder com a versão do cluster)
#
# Observação (Windows/Docker Desktop): se o container do opensearch não subir e o log
# mencionar "max virtual memory areas vm.max_map_count [65530] is too low", rode no
# WSL (wsl -d docker-desktop) ou no PowerShell com WSL:
#   wsl -d docker-desktop sysctl -w vm.max_map_count=262144

services:
  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: cf-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # Cluster de teste local: desliga o plugin de segurança (sem TLS/usuário/senha).
      # NUNCA usar essa configuração fora de ambiente local.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - cf-opensearch-data:/usr/share/opensearch/data
    networks:
      - cf-opensearch-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: cf-opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      - opensearch
    networks:
      - cf-opensearch-net

networks:
  cf-opensearch-net:
    driver: bridge

volumes:
  cf-opensearch-data:
